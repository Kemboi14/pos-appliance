[workspace]
resolver = "3"
members = [
    "pos-core",
    "pos-hal",
    "pos-store",
    "pos-ui",
    "pos-escpos",
    "pos-app",
    "pos-drivers",
    "pos-net",
    "platform-uefi",
    "kernel",
    "stage0",
    "xtask",
]
# Host-testable crates. The firmware/kernel binaries are built by xtask with
# an explicit --target; they are not part of a plain `cargo test`.
default-members = [
    "pos-core",
    "pos-hal",
    "pos-store",
    "pos-ui",
    "pos-escpos",
    "pos-app",
    "pos-drivers",
    "pos-net",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
pos-core = { path = "pos-core" }
pos-hal = { path = "pos-hal" }
pos-store = { path = "pos-store" }
pos-ui = { path = "pos-ui" }
pos-escpos = { path = "pos-escpos" }
pos-app = { path = "pos-app" }
pos-drivers = { path = "pos-drivers" }
pos-net = { path = "pos-net" }

serde = { version = "=1.0.229", default-features = false, features = ["derive", "alloc", "rc"] }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
blake3 = { version = "=1.8.7", default-features = false, features = ["pure"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc"] }
uefi = { version = "=0.41.0", features = ["alloc", "global_allocator"] }
proptest = { version = "=1.12.0" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
float_arithmetic = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Money literals are written major_minor: 116_00 means 116.00 in cents.
inconsistent_digit_grouping = "allow"
mistyped_literal_suffixes = "allow"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"
incremental = false

# Optimise dependencies in dev builds (Argon2/BLAKE3 are unusably slow at
# opt-level 0 inside UEFI); workspace crates stay debuggable.
[profile.dev.package."*"]
opt-level = 2
# Software rendering (per-pixel blending, image scaling) must stay fast in
# debug kernels too, or a slow frame looks like a held key to typematic.
[profile.dev.package.pos-ui]
opt-level = 2
