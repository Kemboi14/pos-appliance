name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Actions are pinned by commit SHA (tags are mutable).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Enable KVM for QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Toolchain
        run: nix develop --command rustup show active-toolchain
      - name: fmt + clippy (host and UEFI, with/without debug console)
        run: nix develop --command cargo xtask lint
      - name: Host tests (core, store fault injection, ui, escpos, app)
        run: nix develop --command cargo xtask test
      - name: Image build
        run: nix develop --command cargo xtask image --release
      - name: QEMU smoke
        run: nix develop --command cargo xtask smoke --release
      - name: Tier B kernel smoke (Limine, framebuffer, RTC, RNG)
        run: nix develop --command cargo xtask smoke --kernel --release
      - name: Tier B tampered kernel / limine.conf refused
        run: nix develop --command cargo xtask tamper-test
      - name: Tier B store-key handover (stage 0 -> kernel)
        run: nix develop --command cargo xtask key-test
      - name: QEMU end-to-end (sale, power cut, reboot, export)
        run: nix develop --command cargo xtask e2e
      - name: Tier B end-to-end behind a USB hub, export stick hot-plugged
        run: nix develop --command cargo xtask e2e --kernel --hub
      - name: Secure Boot (ephemeral keys)
        run: nix develop --command cargo xtask sb-test
      - name: Tier B Secure Boot chain (stage 0 -> Limine -> kernel)
        run: nix develop --command cargo xtask sb-test --kernel
      - name: Reproducibility
        run: nix develop --command cargo xtask repro
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pos-images
          path: |
            out/pos.img
            out/BOOTX64.EFI
            out/pos-kernel.img
            out/pos-kernel-signed.img
            out/printer_boot1.bin
            out/*.ppm
            out/console.log
